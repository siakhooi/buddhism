name: Test build
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: siakhooi/devcontainer:latex
      options: --user root
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Initialize pyenv and check version
        run: |
          export PYENV_ROOT="/home/maui/.pyenv"
          export PATH="$PYENV_ROOT/shims:$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init -)"
          eval "$(pyenv virtualenv-init -)"
          pyenv versions
      - run: ./scripts/build.sh xin-jing
      - run: ./scripts/build_pdf.sh xin-jing
