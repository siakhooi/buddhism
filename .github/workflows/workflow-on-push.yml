name: Test build
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_call:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: siakhooi/devcontainer:latex
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: build
        run: |
          export PYENV_ROOT="/home/maui/.pyenv"
          export PATH="$PYENV_ROOT/shims:$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init -)"
          eval "$(pyenv virtualenv-init -)"
          pyenv versions
          ./scripts/build-all-pdf.sh
